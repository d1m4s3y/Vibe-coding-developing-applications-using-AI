<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Ночь в музее - Конструктор события</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <h1 id="event-title">Ночь в музее</h1>
      <p>15 ноября, 18:30</p>
      <p>Музей космонавтики, проспект Мира, 111</p>
      <p>Вечерняя программа с выставкой и экскурсиями</p>
      <button id="show-program" type="button">Показать программу</button>
      <p id="program" hidden></p>
    </div>
    <div id="data-error" class="error-box" hidden>Ошибка данных.</div>
    <form id="service-form" class="card form-spacing">
      <label> <input type="checkbox" id="guide" /> Экскурсия с гидом </label>
      <br /><br />
      <label> <input type="checkbox" id="audio" /> Аудиогид </label>
      <br /><br />
      <label> <input type="checkbox" id="catalog" /> Каталог выставки </label>
      <br /><br />
      <button type="submit">Рассчитать</button>
    </form>
    <div id="choice-error" class="error-box" hidden>
      Выберите хотя бы одну услугу.
    </div>
    <div id="result" class="card result-spacing" hidden></div>
    <div id="report-json" class="card result-spacing" hidden></div>
    <script src="app.js"></script>
  </body>
</html>
